name: Deploy Next.js to Hostinger

on:
  push:
    branches:
      - master
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install

      - name: Build Project
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          npm run build
          rm -rf _next public/_next static public/static
          mkdir -p _next/static public/_next/static static public/static
          cp -r .next/static/* _next/static/ || true
          cp -r .next/static/* _next/ || true
          cp -r .next/static/* public/_next/static/ || true
          cp -r .next/static/* public/_next/ || true
          cp -r .next/static/* static/ || true
          cp -r .next/static/* public/static/ || true
          # Copy pre-rendered HTML files both as route.html and route/index.html for 100% clean URL routing
          cp .next/server/app/index.html index.html || true
          cp .next/server/app/index.html public/index.html || true
          
          mkdir -p dashboard properties agents blog contact calculators compare privacy terms
          cp .next/server/app/dashboard.html dashboard.html || true
          cp .next/server/app/dashboard.html dashboard/index.html || true
          cp .next/server/app/dashboard.html public/dashboard.html || true
          
          cp .next/server/app/properties.html properties.html || true
          cp .next/server/app/properties.html properties/index.html || true
          cp .next/server/app/properties.html public/properties.html || true
          
          cp .next/server/app/agents.html agents.html || true
          cp .next/server/app/agents.html agents/index.html || true
          
          cp .next/server/app/blog.html blog.html || true
          cp .next/server/app/blog.html blog/index.html || true
          
          cp .next/server/app/contact.html contact.html || true
          cp .next/server/app/contact.html contact/index.html || true
          
          cp .next/server/app/calculators.html calculators.html || true
          cp .next/server/app/calculators.html calculators/index.html || true
          
          cp .next/server/app/compare.html compare.html || true
          cp .next/server/app/compare.html compare/index.html || true
          
          cp .next/server/app/privacy.html privacy.html || true
          cp .next/server/app/privacy.html privacy/index.html || true
          
          cp .next/server/app/terms.html terms.html || true
          cp .next/server/app/terms.html terms/index.html || true

          # Ensure image assets exist at root /images/ and /public/images/
          mkdir -p images public/images
          cp -r public/images/* images/ || true

      - name: Zip Files for Transfer
        run: zip -r deploy.zip . -x "node_modules/*" ".git/*" ".github/*" "deploy.zip"

      - name: Upload to Hostinger via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          port: ${{ secrets.HOSTINGER_PORT }}
          source: "deploy.zip"
          target: "domains/zameengem.com/public_html"
          overwrite: true

      - name: Extract and Install on Hostinger Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          port: ${{ secrets.HOSTINGER_PORT }}
          script: |
            cd domains/zameengem.com/public_html
            # Extract deployment bundle with zip overwrite while preserving CSS fallbacks
            unzip -o deploy.zip
            rm -f deploy.zip
            find . -type d -exec chmod 755 {} + 2>/dev/null || true
            find . -type f -exec chmod 644 {} + 2>/dev/null || true
            chmod -R 755 _next .next public static images 2>/dev/null || true
            (source ~/.profile || true)
            mkdir -p tmp
            touch tmp/restart.txt || true
            (npx pm2 restart all || true)
            (pm2 reload all || true)
